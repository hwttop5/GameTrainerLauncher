name: commitlint

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate commit history
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run commitlint:history -- "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            npm run commitlint:history -- "${{ github.sha }}"
          fi
